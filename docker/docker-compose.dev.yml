version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres-dev
    restart: unless-stopped

    ports:
      - '5432:5432'

    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
      TZ: Asia/Shanghai

    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata-dev:
